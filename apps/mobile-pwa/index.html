<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06b6d4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ask C4S" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<title>Ask C4S — Field</title>
<!--
  Ask C4S (Field) — the mobile PWA.

  WHY THIS EXISTS: field techs work from Apple/Android phones and iPads.
  Chrome on Android cannot run extensions at all, and iOS forces every browser
  onto WebKit — so the Chrome extension can NEVER reach them. A PWA is the only
  door to the people this product is actually for.

  SCOPE (honest): this is a working scaffold, not the finished field app.
  Shipped: installable shell, offline, My Day (live SAP), ticket detail.
  Planned: /prep-pm, /parts-check, /order-parts, /book-time, /close-out, /nearby.

  Deliberately vanilla — no Vite, no React, no node_modules — matching
  apps/light-admin and the extension's own popup.js. That keeps the Dockerfile
  a plain COPY with zero build step.
-->
<!-- The single source of truth for the look: tokens, cards, pills, buttons,
     inputs, banners, kv rows, markdown, and the loaders — shared with the
     light-admin and (next) the extension. Only the PWA SHELL is styled below. -->
<link rel="stylesheet" href="/shared/askc4s.css" />
<style>
  /* Shell-only: the mobile chrome (gradient header, bottom nav, safe areas).
     Everything else — cards, pills, buttons, loaders — comes from the shared
     design system above, so there is nothing here to keep in sync. */
  :root{ --safe-b:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;
       padding-bottom:calc(64px + var(--safe-b));overscroll-behavior-y:contain}
  /* Brand gradient header — the extension's own --primary family. */
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#06b6d4,#3b82f6 40%,#8b5cf6 100%);
         color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em}
  /* "AI Companion" tag next to the product name — matches the extension. */
  .title-tag{font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;
             background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;white-space:nowrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;color:#fff;
        background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
  main{padding:14px;max-width:640px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
      border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:10;box-shadow:0 -1px 3px rgba(15,23,42,.05)}
  nav button{flex:1;border:0;border-radius:0;background:none;padding:11px 4px;font-size:10.5px;
             font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.on{color:var(--accent)}
  nav svg{width:20px;height:20px}
  .soon{opacity:.6}
  /* The PWA renders bare <h2> section headers; the shared file styles h2.c4s. */
  main h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 0 10px;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>Ask C4S</h1>
  <span class="title-tag">AI Companion</span>
  <span style="margin-left:auto"></span>
  <span class="chip" id="who" onclick="go('me')" style="cursor:pointer">not set</span>
  <span class="chip" id="ver">v…</span>
</header>

<main>
  <div id="offline" class="banner offline">Offline — showing the last data you loaded.</div>
  <div id="err" class="banner err"></div>
  <div id="view"></div>
</main>

<nav>
  <button id="nav-home" class="on" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    Home
  </button>
  <button id="nav-day" onclick="go('day')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    My Day
  </button>
  <button id="nav-me" onclick="go('me')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
    Me
  </button>
</nav>

<script src="/app.js"></script>
</body>
</html>
